<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HangUp - Family Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for chat */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .pulse-ring { animation: pulse 1.5s infinite cubic-bezier(0.66, 0, 0, 1); }
        @keyframes pulse { to { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen font-sans text-slate-800 transition-colors duration-500" id="body-bg">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl drop-shadow-sm">🛡️</span>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">HangUp <span class="font-normal text-slate-500">Dashboard</span></h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Controls Column -->
        <div class="md:col-span-1 space-y-6">
            
            <!-- Setup Card -->
            <div class="bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md border border-slate-200/60">
                <h2 class="font-semibold text-lg mb-4 text-slate-800">Simulation Setup</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Target Phone Number</label>
                        <input type="text" value="+91 98765 43210" disabled class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Scenario</label>
                        <select class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-700 bg-white">
                            <option>FedEx / Customs Block</option>
                            <option disabled>Digital Arrest (Coming Soon)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Family Safe-Word</label>
                        <input id="safeWordInput" type="text" value="Pineapple" disabled class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-500">
                    </div>
                </div>

                <div class="mt-8 space-y-3">
                    <button id="startBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl transition-all flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        <span>Initiate Call</span>
                    </button>
                    <button id="stopBtn" disabled class="w-full bg-red-500 hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-3 rounded-xl transition-all shadow-[0_0_0_0_rgba(239,68,68,0.7)] flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.516l1.13-2.257a1 1 0 00-.502-1.21l-4.493-1.498A1 1 0 005 4.28V3z"></path></svg>
                        <span>Hang Up</span>
                    </button>
                </div>
            </div>

            <!-- Scorecard (Hidden by default) -->
            <div id="scoreCard" class="hidden bg-white/95 backdrop-blur p-6 rounded-2xl shadow-md border border-slate-200/60">
                <h2 class="font-semibold text-lg text-slate-800 mb-2">Simulation Results</h2>
                <div class="text-4xl font-bold text-center py-4" id="scoreValue">--/100</div>
                <p class="text-sm text-slate-500 text-center" id="scoreSubtext">Awaiting completion...</p>
            </div>

        </div>

        <!-- Chat / Call Interface -->
        <div class="md:col-span-2 flex flex-col h-[600px] bg-white/95 backdrop-blur rounded-2xl shadow-md border border-slate-200/60 overflow-hidden relative">
            <!-- Header inside chat -->
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center z-10">
                <div>
                    <h3 class="font-medium text-slate-800">Live Call Transcript</h3>
                    <p class="text-xs text-slate-500 flex items-center mt-1" id="callStatus">
                        <span class="w-2 h-2 rounded-full bg-slate-300 mr-2" id="statusDot"></span>
                        Ready to simulate
                    </p>
                </div>
            </div>

            <!-- Messages area -->
            <div id="log" class="flex-1 overflow-y-auto p-6 space-y-4 chat-scroll bg-white relative z-0">
                <div class="text-center text-sm text-slate-400 mt-10">
                    The transcript will appear here once the call starts.
                </div>
            </div>
            
        </div>
    </main>

    <script>
        let ws;
        let audioContext;
        let mediaStream;
        let processor;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logDiv = document.getElementById('log');
        const callStatus = document.getElementById('callStatus');
        const statusDot = document.getElementById('statusDot');
        const bodyBg = document.getElementById('body-bg');
        const scoreCard = document.getElementById('scoreCard');
        const scoreValue = document.getElementById('scoreValue');
        const scoreSubtext = document.getElementById('scoreSubtext');
        
        // Rotating Safe Word Logic
        const safeWords = ["Pineapple", "Bluebird", "Lighthouse", "Stargazer", "Moonlight", "Watermelon", "Evergreen", "Thunder"];
        const safeWordInput = document.getElementById('safeWordInput');
        const currentSafeWord = safeWords[Math.floor(Math.random() * safeWords.length)];
        safeWordInput.value = currentSafeWord;

        function appendBubble(sender, text, type = 'normal') {
            // Remove the empty state message if it exists
            if (logDiv.innerHTML.includes("transcript will appear here")) {
                logDiv.innerHTML = "";
            }

            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${sender === 'You' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            
            if (type === 'coach') {
                bubble.className = "max-w-[85%] bg-red-100 text-red-900 border border-red-200 px-5 py-3 rounded-2xl rounded-tl-sm text-sm font-medium flex flex-col shadow-sm";
                bubble.innerHTML = `<span class="text-xs text-red-600 font-bold mb-1 uppercase tracking-wider flex items-center">🛡️ Coach Intervention</span>${text}`;
            } else if (sender === 'You') {
                bubble.className = "max-w-[75%] bg-slate-900 text-white px-5 py-3 rounded-2xl rounded-tr-sm text-sm shadow-sm";
                bubble.innerText = text;
            } else {
                bubble.className = "max-w-[75%] bg-slate-100 text-slate-800 px-5 py-3 rounded-2xl rounded-tl-sm text-sm shadow-sm";
                bubble.innerHTML = `<span class="text-xs text-slate-500 font-semibold block mb-1">Scammer (Kavita)</span>${text}`;
            }

            wrapper.appendChild(bubble);
            logDiv.appendChild(wrapper);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(text, color) {
            document.getElementById('callStatus').innerHTML = `<span class="w-2 h-2 rounded-full mr-2 ${color}"></span>${text}`;
        }

        startBtn.onclick = async () => {
            setStatus("Connecting to secure server...", "bg-yellow-400 animate-pulse");
            ws = new WebSocket('ws://localhost:8000/media-stream');

            ws.onopen = async () => {
                setStatus("Requesting microphone...", "bg-yellow-400 animate-pulse");
                startBtn.disabled = true;
                stopBtn.disabled = false;
                stopBtn.classList.add("pulse-ring"); // Add animation to hangup

                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    setStatus("Call connected. Live monitoring active.", "bg-green-500");
                    
                    audioContext = new AudioContext({ sampleRate: 16000 });
                    const source = audioContext.createMediaStreamSource(mediaStream);
                    
                    // Use ScriptProcessorNode to capture raw PCM audio
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    
                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        // Convert float32 to int16 for Deepgram
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            const s = Math.max(-1, Math.min(1, inputData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(pcmData.buffer);
                        }
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);

                } catch (err) {
                    setStatus("Microphone error: " + err.message, "bg-red-500");
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'transcript') {
                    appendBubble('You', data.text);
                } else if (data.type === 'agent_response') {
                    appendBubble('Officer', data.text);
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.rate = 1.1; 
                    utterance.pitch = 0.9;
                    window.speechSynthesis.speak(utterance);
                } else if (data.type === 'coach_interruption') {
                    appendBubble('Coach', data.text, 'coach');
                    
                    // Extract score visually if it exists in the string (e.g. "Score is 50/100")
                    const scoreMatch = data.text.match(/Score is (\d+)\/100/);
                    if(scoreMatch) {
                        scoreCard.classList.remove('hidden');
                        const scoreNum = parseInt(scoreMatch[1]);
                        scoreValue.innerText = scoreMatch[1] + "/100";
                        if (scoreNum >= 80) scoreValue.className = "text-4xl font-bold text-center py-4 text-green-500";
                        else if (scoreNum >= 50) scoreValue.className = "text-4xl font-bold text-center py-4 text-yellow-500";
                        else scoreValue.className = "text-4xl font-bold text-center py-4 text-red-500";
                        scoreSubtext.innerText = "Safe-word drill active...";
                    }

                    // Immediately stop the scammer from talking
                    window.speechSynthesis.cancel();
                    
                    // Flash the screen red for the demo
                    bodyBg.classList.replace("bg-slate-50", "bg-red-50");
                    setTimeout(() => bodyBg.classList.replace("bg-red-50", "bg-slate-50"), 3000);

                    // Speak the coach voice
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.rate = 0.95; 
                    utterance.pitch = 1.2;
                    window.speechSynthesis.speak(utterance);
                } else if (data.type === 'end_session') {
                    if (ws) ws.close();
                    stopRecording();
                    scoreSubtext.innerText = "Drill complete! Final result logged.";
                }
            };

            ws.onclose = () => {
                setStatus("Call disconnected.", "bg-slate-400");
                stopRecording();
            };
        };

        stopBtn.onclick = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "end_call", safe_word: currentSafeWord }));
                stopBtn.disabled = true;
                stopBtn.classList.remove("pulse-ring");
                setStatus("Drill mode active...", "bg-blue-500 animate-pulse");
            } else {
                stopRecording();
            }
        };

        function stopRecording() {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.classList.remove("pulse-ring");
            
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }
    </script>
</body>
</html>
